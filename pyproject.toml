[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dem-tool"
version = "0.1.0"
description = "Flujos reproducibles de geomorfometría e hidrología DEM"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<2.3", "scipy>=1.14,<2", "rasterio>=1.4,<2", "geopandas>=1,<2", "shapely>=2,<3", "pyproj>=3.6,<4", "PySide6>=6.8,<7", "matplotlib>=3.9,<4", "pysheds>=0.5,<0.6", "numba>=0.61,<1", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
dem-tool = "dem_tool.main:main"

[tool.setuptools.packages.find]
include = ["dem_tool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
